services:
  - type: web
    name: atlas-bi
    runtime: python
    plan: free
    region: singapore
    branch: master
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.ingest && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
